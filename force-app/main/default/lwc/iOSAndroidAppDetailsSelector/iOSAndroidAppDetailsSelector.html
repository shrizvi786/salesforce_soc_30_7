        <template if:true={showIOSNotificationModal}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container custom-modal">
                    <header class="custom-header ios">
                        <h2>Send Push Notification to Schools</h2>
                    </header>
                    <div class="slds-modal__content custom-body">
                        <div class="field-block">
                            <label class="custom-label">Title</label>
                            <lightning-input type="text" value={iosNotificationTitle} onchange={handleIOSTitleChange}
                                placeholder="Message title..." variant="label-hidden" required>
                            </lightning-input>
                        </div>
                        <div class="field-block">
                            <label class="custom-label">Message</label>
                            <lightning-textarea value={iosNotificationBody} onchange={handleIOSBodyChange}
                                placeholder="Message description..." rows="5" variant="label-hidden" required>
                            </lightning-textarea>
                        </div>
                        <div class="field-block">
                            <label class="custom-label">Image URL</label>
                            <lightning-input type="text" value={iosNotificationImageUrl}
                                onchange={handleIOSImageUrlChange} variant="label-hidden" placeholder="Image URL...">
                            </lightning-input>
                        </div>
                        <div class="field-block">
                            <label class="custom-label">Launch URL</label>
                            <lightning-input type="text" value={iosNotificationLaunchUrl}
                                onchange={handleIOSLaunchUrlChange} variant="label-hidden" placeholder="Launch URL...">
                            </lightning-input>
                        </div>
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col">
                                <label class="custom-label">Schedule Date</label>
                                <lightning-input type="date" value={iosScheduledDate}
                                    onchange={handleIOSScheduledDateChange} variant="label-hidden">
                                </lightning-input>
                            </div>
                            <div class="slds-col">
                                <label class="custom-label">Schedule Time</label>
                                <lightning-input type="time" value={iosScheduledTime}
                                    onchange={handleIOSScheduledTimeChange} variant="label-hidden">
                                </lightning-input>
                            </div>
                        </div>
                        <div class="field-block">
                            <lightning-input type="checkbox" checked={iosIsPinChecked}
                                onchange={handleIOSPinCheckboxChange} label="Pin Push Messages">
                            </lightning-input>
                        </div>
                        <template if:true={iosIsPinChecked}>
                            <div class="field-block">
                                <label class="custom-label">Select Pin End Date</label>
                                <p style="font-size: 12px; color: #666; margin-top: -10px;">
                                    (Note: Pin will end at 11:59 PM EST on selected date)
                                </p>
                                <lightning-input type="date" value={iosPinEndDate} onchange={handleIOSPinEndDateChange}
                                    variant="label-hidden" placeholder="Select a date">
                                </lightning-input>
                            </div>
                        </template>

                        <template if:true={isIOSModalLoading}>
                            <div class="modal-loader-overlay">
                                <div class="modal-loader-container">
                                    <lightning-spinner alternative-text="Sending..." size="medium"
                                        variant="brand"></lightning-spinner>
                                    <p class="slds-m-top_small slds-text-color_weak">Sending notifications...</p>
                                </div>
                            </div>
                        </template>
                    </div>
                    <footer class="custom-footer">
                        <lightning-button label="Cancel" onclick={closeIOSNotificationModal} class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button label="Send" variant="brand" onclick={sendIOSNotification}
                            class="slds-m-right_small">
                        </lightning-button>
                        // <lightning-button label="Add Poll" variant="neutral" onclick={openIOSPollModal}></lightning-button> 
                        <lightning-button label={pollButtonLabel} onclick={openIOSPollModal} variant="neutral"
                            class="add-option-button">
                        </lightning-button>

                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <template if:true={showIOSPollModal}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container" style="width: 720px; max-width: 90vw;">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Create Poll</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-form-element">
                            <div class="slds-form-element__control">
                                <label class="slds-form-element__label">
                                    Poll Question <abbr class="slds-required" title="required">*</abbr>
                                </label>
                                <lightning-input type="text" value={pollQuestion} onchange={handlePollQuestionChange}
                                    placeholder="Enter your poll question" variant="label-hidden" required>
                                </lightning-input>
                            </div>
                        </div>
                        <div class="slds-grid slds-gutters poll-options-container">
                            <div class="slds-col">
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label">
                                        Options (Max 5)
                                        <abbr class="slds-required" title="required">*</abbr>
                                    </label>
                                    <div class="slds-form-element__control">
                                        <template for:each={pollOptions} for:item="option" for:index="index">
                                            <div key={option.id} class="slds-grid slds-gutters poll-option-input">
                                                <div class="slds-col slds-size_10-of-12">
                                                    <lightning-input type="text" value={option.value}
                                                        onchange={handlePollOptionChange} data-index={index}
                                                        placeholder={option.placeholder} variant="label-hidden"
                                                        required={option.isRequired}>
                                                    </lightning-input>
                                                </div>
                                                <template if:true={option.canDelete}>
                                                    <div class="slds-col slds-size_2-of-12 slds-align-middle">
                                                        <lightning-button-icon icon-name="utility:delete"
                                                            onclick={removePollOption} data-index={index}
                                                            alternative-text="Remove option" variant="bare"
                                                            class="remove-option-icon">
                                                        </lightning-button-icon>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <lightning-button label="Add Option" onclick={addPollOption}
                                            disabled={isAddOptionDisabled} variant="neutral" class="add-option-button">
                                        </lightning-button>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-col active-until-container">
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label">
                                        Active Until
                                        <abbr class="slds-required" title="required">*</abbr>
                                    </label>
                                    <div class="slds-form-element__control">
                                        <div class="slds-grid slds-gutters">
                                            <div class="slds-col">
                                                <lightning-input type="date" value={pollEndDate}
                                                    onchange={handlePollEndDateChange} required variant="label-hidden">
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col">
                                                <lightning-input type="time" value={pollEndTime}
                                                    onchange={handlePollEndTimeChange} required variant="label-hidden">
                                                </lightning-input>
                                            </div>
                                        </div>
                                        <div class="note-text">
                                            (Note: Time Zone for poll is EST)
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeIOSPollModal} class="slds-button">
                        </lightning-button>
                        <lightning-button label="Save Poll" variant="brand" onclick={savePoll}
                            disabled={isPollFormValid} class="slds-button">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

                            <lightning-input type="text" value={contactNotificationImageUrl}

                        </div>
                        <template if:true={isContactModalLoading}>
                            <div class="modal-loader-overlay">
                                <div class="modal-loader-container">
                                    <lightning-spinner alternative-text="Sending..." size="medium"

                                    <p class="slds-m-top_small slds-text-color_weak">Sending notifications...</p>
                                </div>
                            </div>
                        </template>
                    </div>
                  ///////<footer class="custom-footer">
                        <lightning-button label="Cancel" onclick={closeContactNotificationModal}
                            class="slds-m-right_small">
                        </lightning-button>
                        <lightning-button label="Send" variant="brand" onclick={sendContactNotification}>

                    </footer>///////
                    <footer class="custom-footer">
                        <lightning-button label="Cancel" onclick={closeContactNotificationModal}

                        </lightning-button>
                        <lightning-button label="Send" variant="brand" onclick={sendContactNotification}

                        </lightning-button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

                                </span>
                                <div class="slds-m-left_x-small">

                                        data-index={index} alternative-text="Edit"

                                    variant="brand"></lightning-spinner>

            </template>

            <template if:false={visibleRecords.length}>
                <div class="slds-grid slds-grid_align-end slds-m-bottom_x-small">

        <template if:true={showIOSNotificationModal}>

                    </header>
                    <div class="slds-modal__content custom-body">

                            <label class="custom-label">Title</label>
                            <lightning-input type="text" value={iosNotificationTitle} onchange={handleIOSTitleChange}

                            </lightning-input>
                        </div>
                        <div class="field-block">
                            <label class="custom-label">Message</label>
                            <lightning-textarea value={iosNotificationBody} onchange={handleIOSBodyChange}

                        </div>
                        <div class="field-block">
                            <label class="custom-label">Launch URL</label>
                            <lightning-input type="text" value={iosNotificationLaunchUrl}

                        <div class="slds-grid slds-gutters">

                            </div>

                                <label class="custom-label">Schedule Time</label>

                                </lightning-input>

                        </div>

                                <div class="slds-form-element">

                                        <abbr class="slds-required" title="required">*</abbr>
                                    </label>

                                                <div class="slds-col slds-size_10-of-12">
                                                    <lightning-input type="text" value={option.value}
                                                        onchange={handlePollOptionChange} data-index={index}

                                                    </lightning-input>
                                                </div>

                                                    <div class="slds-col slds-size_2-of-12 slds-align-middle">

                                                            onclick={removePollOption} data-index={index}

                                                        </lightning-button-icon>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>

                                    </div>
                                </div>
                            </div>

                                    <label class="slds-form-element__label">

                                        <abbr class="slds-required" title="required">*</abbr>
                                    </label>

                                        <div class="slds-grid slds-gutters">
                                            <div class="slds-col">
                                                <lightning-input type="date" value={pollEndDate}
                                                    onchange={handlePollEndDateChange} required variant="label-hidden">
                                                </lightning-input>
                                            </div>
                                            <div class="slds-col">
                                                <lightning-input type="time" value={pollEndTime}
                                                    onchange={handlePollEndTimeChange} required variant="label-hidden">
                                                </lightning-input>
                                            </div>
                                        </div>
                                        <div class="note-text">
                                            (Note: Time Zone for poll is EST)
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeIOSPollModal} class="slds-button">
                        </lightning-button>
                        <lightning-button label="Save Poll" variant="brand" onclick={savePoll}
                            disabled={isPollFormValid} class="slds-button">
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
