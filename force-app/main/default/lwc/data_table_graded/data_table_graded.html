<template>    
    <div class={containerClass}>   
        <lightning-card title="GRADED+" icon-name="custom:custom19">
            <div class="table-container" if:true={isTableVisible} >
                <lightning-datatable
                    key-field="Id"
                    data={data}
                    columns={displayedColumns}
                    hide-checkbox-column
                    onrowselection={handleRowSelection}
                    
                ></lightning-datatable>
            </div>
            <div class="loading-container" if:false={isTableVisible}>
                <div class="spinner-container">
                    <lightning-spinner alternative-text="Loading" variant="brand" size="medium"></lightning-spinner>
                </div>
            </div>
          
            <div class="pagination-controls">
              
                <template if:false={showSpinner}>
                    <lightning-button class="view-all-button"  label={buttonLabel} variant="neutral" onclick={toggleFullScreen} style="margin-right: 1vh;"></lightning-button>
                    <!-- <lightning-button class="close-button" label="Close" variant="neutral" onclick={toggleFullScreen}></lightning-button> -->
                </template>
                
                <template if:true={showSpinner}>
                    <div class="spinner-container">
                    <lightning-spinner alternative-text="Loading" variant="brand" size="medium"  ></lightning-spinner>
                </div>
                </template>
                <template if:false={showSpinner}>
                    <lightning-button label="Previous" variant="neutral" disabled={isFirstPage} onclick={handlePreviousPage} class="prevbutn" style="margin-right: 1vh;"></lightning-button>
                </template>
                <template if:false={showSpinner}>
                    <lightning-button label="Next" data-id="nextButton" variant="neutral" disabled={disableNextButton} onclick={handleNextPage} style="margin-right: 1vh;  "
                     ></lightning-button>
                </template>       
            </div>
        </lightning-card>
    </div>
    
</template>
