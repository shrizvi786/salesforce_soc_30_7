<template>
    <lightning-card title="Rollup Groups &amp; Assessment Bands" icon-name="standard:task2">
        <div class="slds-p-around_medium">
            <div class="toolbar-above-search slds-m-bottom_small">
                <lightning-button
                    label="Group"
                    title="Create a rollup group from selected assessments (select at least two)"
                    variant="brand"
                    onclick={openGroupModal}
                    disabled={isGroupButtonDisabled}
                ></lightning-button>
            </div>

            <!-- Search bar -->
            <div class="slds-m-bottom_small">
                <lightning-input
                    type="search"
                    label="Search assessments"
                    variant="label-hidden"
                    placeholder="Search by ID, name, or DBN..."
                    value={searchTerm}
                    onchange={handleSearch}
                ></lightning-input>
            </div>

            <!-- Rollup group: placed under search so it is visible without scrolling past the table -->
            <template if:false={isLoading}>
                <div class="rollup-panel slds-box slds-theme_shade slds-m-bottom_medium">
                    <div class="rollup-panel-header slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div>
                            <h3 class="slds-text-heading_small slds-m-bottom_xx-small">Add or remove in an existing group</h3>
                            <p class="slds-text-body_small slds-text-color_weak rollup-panel-help">
                                <strong>1.</strong> Select row(s) in the assessments table below.
                                <strong>2.</strong> Click the search field to open the list, then type to filter or pick a group (same name as the Salesforce record).
                                <strong>3.</strong> Click <strong>Add selected to group</strong>.
                                To remove, pick the group, select member rows, then <strong>Remove selected from group</strong>
                                (each group must keep at least two).
                            </p>
                        </div>
                        <lightning-button-icon
                            icon-name="utility:refresh"
                            alternative-text="Refresh group list"
                            title="Refresh group list"
                            variant="border"
                            onclick={handleRefreshRollupGroups}
                        ></lightning-button-icon>
                    </div>
                    <div class="rollup-panel-controls slds-m-top_small" data-rollup-picker-panel>
                        <lightning-input
                            type="search"
                            label="Search rollup groups"
                            variant="label-hidden"
                            placeholder="Click to open list, then search by name or date…"
                            value={rollupGroupSearchTerm}
                            onchange={handleRollupGroupSearch}
                            onfocus={handleRollupGroupSearchFocus}
                            onblur={handleRollupGroupSearchBlur}
                            class="group-picker-search"
                        ></lightning-input>
                        <template if:true={isRollupGroupListOpen}>
                            <div class="group-picker-scroll slds-m-top_x-small" role="listbox" aria-label="Rollup groups">
                                <template if:true={rollupGroupDropdownEmpty}>
                                    <p class="slds-text-body_small slds-text-color_weak slds-p-around_small">
                                        No groups match your search.
                                    </p>
                                </template>
                                <template for:each={filteredRollupGroupRows} for:item="row">
                                    <button
                                        key={row.value}
                                        type="button"
                                        class={row.rowClass}
                                        data-id={row.value}
                                        onclick={handlePickRollupGroup}
                                    >
                                        {row.label}
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>

                    <template if:true={hasRollupGroupSelected}>
                        <div class="rollup-members-toolbar slds-m-top_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap">
                            <div class="rollup-members-heading slds-text-color_weak slds-m-right_small">
                                <span class="slds-text-title_caps">Assessment of this group</span>
                                <span class="rollup-members-heading-name"> &mdash; {selectedRollupGroupName}</span>
                            </div>
                            <div class="rollup-members-toolbar-actions">
                                <lightning-button
                                    label="Edit performance bands for group"
                                    title="Apply the same performance level bands to every assessment in this group"
                                    variant="neutral"
                                    onclick={openGroupBandsModal}
                                    disabled={isGroupBandsButtonDisabled}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button
                                    label="Assign group to dashboard"
                                    title="Open the dashboard tree: drag the group onto a top row or main menu"
                                    variant="neutral"
                                    onclick={openDashboardAssignModal}
                                    disabled={isAssignToDashboardDisabled}
                                    class="slds-m-right_x-small"
                                ></lightning-button>
                                <lightning-button-icon
                                    icon-name="utility:refresh"
                                    alternative-text="Refresh members"
                                    title="Refresh members"
                                    variant="border"
                                    onclick={handleRefreshMembers}
                                    disabled={isLoadingMembers}
                                ></lightning-button-icon>
                            </div>
                        </div>
                        <template if:true={isLoadingMembers}>
                            <div class="slds-align_absolute-center slds-p-around_medium">
                                <lightning-spinner alternative-text="Loading members" size="small"></lightning-spinner>
                            </div>
                        </template>
                        <template if:false={isLoadingMembers}>
                            <div class="rollup-members-table slds-m-top_x-small">
                                <lightning-datatable
                                    key-field="Id"
                                    key={memberDatatableKey}
                                    data={groupMemberRows}
                                    columns={memberColumns}
                                    max-row-selection={memberMaxRowSelection}
                                    selected-rows={selectedMemberRowIds}
                                    onrowselection={handleMemberRowSelection}
                                ></lightning-datatable>
                            </div>
                            <div class="rollup-member-actions slds-m-top_small slds-grid slds-wrap slds-gutters_x-small">
                                <div class="slds-col slds-grow-none">
                                    <lightning-button
                                        label="Add selected to group"
                                        title="Adds selected assessments from the main table into this group"
                                        variant="brand"
                                        onclick={handleAddToRollupGroup}
                                        disabled={isAddToRollupGroupDisabled}
                                    ></lightning-button>
                                </div>
                                <div class="slds-col slds-grow-none">
                                    <lightning-button
                                        label="Remove selected from group"
                                        title="Removes selected member rows (group must keep at least two)"
                                        variant="destructive"
                                        onclick={handleRemoveFromRollupGroup}
                                        disabled={isRemoveFromRollupGroupDisabled}
                                    ></lightning-button>
                                </div>
                            </div>
                        </template>
                    </template>
                </div>
            </template>

            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large loading-container">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    <p class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
                        Loading assessments&hellip;
                    </p>
                </div>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasAssessments}>
                    <p class="slds-m-bottom_small slds-text-body_small slds-text-color_weak">
                        {showingRange}
                    </p>
                    <div class="datatable-container">
                        <lightning-datatable
                            key-field="Id"
                            key={datatableRenderKey}
                            data={paginatedAssessments}
                            columns={columns}
                            max-row-selection={maxRowSelection}
                            selected-rows={selectedRowIds}
                            onrowselection={handleRowSelection}
                            onrowaction={handleRowAction}
                            onsort={handleSort}
                            sorted-by={sortedBy}
                            sorted-direction={sortDirection}
                        ></lightning-datatable>
                    </div>

                    <!-- Pagination -->
                    <div class="pagination-bar slds-m-top_small">
                        <div class="page-size-wrap">
                            <span class="slds-text-body_small">Rows per page:</span>
                            <lightning-combobox
                                label="Page size"
                                variant="label-hidden"
                                value={pageSizeValue}
                                options={pageSizeOptions}
                                onchange={handlePageSizeChange}
                                class="page-size-combo"
                            ></lightning-combobox>
                        </div>
                        <span class="slds-text-body_small page-info">
                            Page {currentPage} of {totalPages}
                        </span>
                        <div class="page-nav">
                            <lightning-button-icon
                                icon-name="utility:chevronleft"
                                alternative-text="Previous page"
                                onclick={handlePrevPage}
                                disabled={isPrevDisabled}
                                variant="border-filled"
                                size="small"
                            ></lightning-button-icon>
                            <lightning-button-icon
                                icon-name="utility:chevronright"
                                alternative-text="Next page"
                                onclick={handleNextPage}
                                disabled={isNextDisabled}
                                variant="border-filled"
                                size="small"
                            ></lightning-button-icon>
                        </div>
                    </div>
                </template>

                <template if:false={hasAssessments}>
                    <div class="slds-align_absolute-center slds-p-around_large">
                        <p class="slds-text-body_regular slds-text-color_weak">
                            No recently added assessments found.
                        </p>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>

    <!-- Performance Levels Bands Modal -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-wide">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeModal}
                    ></lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium modal-content-no-scroll">
                    <template if:true={isModalLoading}>
                        <div class="slds-align_absolute-center" style="height: 200px;">
                            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isModalLoading}>
                        <!-- Assessment info bar -->
                        <div class="assessment-info slds-m-bottom_medium">
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_1-of-3 info-block">
                                    <span class="info-label">Assessment ID</span>
                                    <span class="info-value">{selectedAssessment.Assessment_ID__c}</span>
                                </div>
                                <div class="slds-col slds-size_1-of-3 info-block">
                                    <span class="info-label">Assessment Name</span>
                                    <span class="info-value">{selectedAssessment.Assessment_Name__c}</span>
                                </div>
                                <div class="slds-col slds-size_1-of-3 info-block">
                                    <span class="info-label">DBN</span>
                                    <span class="info-value">{selectedAssessment.DBN__c}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Level cards -->
                        <div class="levels-container">
                            <template for:each={levelsWithStyles} for:item="level">
                                <div key={level.key} class="level-card" style={level.cardStyle}>
                                    <!-- Corner X: appears on card hover -->
                                    <template if:true={level.canRemove}>
                                        <button class="remove-corner-btn"
                                                data-level={level.key}
                                                onclick={handleRemoveLevel}
                                                title="Remove this level"
                                                aria-label="Remove this level">&#215;</button>
                                    </template>
                                    <!-- Badge: number transforms to X on hover -->
                                    <div class="level-badge" style={level.badgeStyle}
                                         data-level={level.key}
                                         onclick={handleBadgeClick}>
                                        <span class="badge-number">{level.num}</span>
                                        <template if:true={level.canRemove}>
                                            <span class="badge-remove">&#215;</span>
                                        </template>
                                    </div>
                                    <div class="level-info">
                                        <template if:false={level.isEditing}>
                                            <span class="level-label-text"
                                                  data-level={level.key}
                                                  ondblclick={handleLabelDblClick}
                                                  title="Double-click to rename">
                                                {level.levelName}
                                            </span>
                                        </template>
                                        <template if:true={level.isEditing}>
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                label="Level name"
                                                value={level.levelName}
                                                data-edit-level={level.key}
                                                onblur={handleLabelBlur}
                                                onkeyup={handleLabelKeyUp}
                                                class="inline-name-input"
                                            ></lightning-input>
                                        </template>
                                    </div>
                                    <div class="level-input-group">
                                        <span class="input-prefix">{level.inputLabel}</span>
                                        <lightning-input
                                            type="number"
                                            variant="label-hidden"
                                            label="Value"
                                            value={level.value}
                                            data-level={level.key}
                                            onchange={handleLevelValueChange}
                                            min="0"
                                            class="value-input"
                                        ></lightning-input>
                                        <span class="input-suffix">%</span>
                                    </div>
                                    <div class="level-color-group">
                                        <input
                                            type="color"
                                            value={level.color}
                                            data-level={level.key}
                                            onchange={handleColorChange}
                                            class="color-swatch" />
                                        <lightning-input
                                            type="text"
                                            variant="label-hidden"
                                            label="Hex"
                                            value={level.color}
                                            data-level={level.key}
                                            onchange={handleHexInput}
                                            class="hex-input"
                                            maxlength="7"
                                        ></lightning-input>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Add level button -->
                        <template if:true={canAddLevel}>
                            <div class="add-level-container slds-m-top_small">
                                <lightning-button
                                    label={addLevelLabel}
                                    icon-name="utility:add"
                                    variant="neutral"
                                    onclick={handleAddLevel}
                                ></lightning-button>
                            </div>
                        </template>

                        <!-- Sequential validation error -->
                        <template if:true={hasSequentialError}>
                            <div class="validation-error slds-m-top_small">
                                <lightning-icon icon-name="utility:error" size="x-small"
                                    variant="error" class="slds-m-right_x-small"></lightning-icon>
                                <span>{sequentialError}</span>
                            </div>
                        </template>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button
                        label="Save &amp; Close"
                        variant="brand"
                        onclick={handleSave}
                        disabled={isSaveDisabled}
                        class="slds-m-left_small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Create rollup group modal -->
    <template if:true={isGroupModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-group">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeGroupModal}
                    ></lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">{groupModalTitle}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isCreatingRollupGroup}>
                        <div class="slds-align_absolute-center slds-p-around_medium">
                            <lightning-spinner alternative-text="Creating group" size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template if:false={isCreatingRollupGroup}>
                        <p class="slds-text-body_small slds-m-bottom_small slds-text-color_weak">
                            Enter a name for this group. The school DBN is added automatically as a prefix in Salesforce
                            (for example, 17K352 - Group Name). Dashboard labels use the name without the DBN.
                            One parent record and one row per selected assessment will be created.
                        </p>
                        <lightning-input
                            type="text"
                            label="Group name"
                            value={groupNameInput}
                            onchange={handleGroupNameChange}
                            required
                            maxlength="255"
                        ></lightning-input>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Cancel"
                        onclick={closeGroupModal}
                        disabled={isCreatingRollupGroup}
                    ></lightning-button>
                    <lightning-button
                        label="Create"
                        variant="brand"
                        class="slds-m-left_small"
                        onclick={handleCreateRollupGroup}
                        disabled={isCreateGroupDisabled}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Bulk performance bands for rollup group -->
    <template if:true={isGroupBandsModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-wide">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeGroupBandsModal}
                    ></lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">{groupBandsModalTitle}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium modal-content-no-scroll">
                    <template if:true={isGroupBandsModalLoading}>
                        <div class="slds-align_absolute-center" style="height: 200px;">
                            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isGroupBandsModalLoading}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                            These bands will be saved for every assessment in this rollup group.
                        </p>

                        <div class="levels-container">
                            <template for:each={levelsWithStyles} for:item="level">
                                <div key={level.key} class="level-card" style={level.cardStyle}>
                                    <template if:true={level.canRemove}>
                                        <button class="remove-corner-btn"
                                                data-level={level.key}
                                                onclick={handleRemoveLevel}
                                                title="Remove this level"
                                                aria-label="Remove this level">&#215;</button>
                                    </template>
                                    <div class="level-badge" style={level.badgeStyle}
                                         data-level={level.key}
                                         onclick={handleBadgeClick}>
                                        <span class="badge-number">{level.num}</span>
                                        <template if:true={level.canRemove}>
                                            <span class="badge-remove">&#215;</span>
                                        </template>
                                    </div>
                                    <div class="level-info">
                                        <template if:false={level.isEditing}>
                                            <span class="level-label-text"
                                                  data-level={level.key}
                                                  ondblclick={handleLabelDblClick}
                                                  title="Double-click to rename">
                                                {level.levelName}
                                            </span>
                                        </template>
                                        <template if:true={level.isEditing}>
                                            <lightning-input
                                                type="text"
                                                variant="label-hidden"
                                                label="Level name"
                                                value={level.levelName}
                                                data-edit-level={level.key}
                                                onblur={handleLabelBlur}
                                                onkeyup={handleLabelKeyUp}
                                                class="inline-name-input"
                                            ></lightning-input>
                                        </template>
                                    </div>
                                    <div class="level-input-group">
                                        <span class="input-prefix">{level.inputLabel}</span>
                                        <lightning-input
                                            type="number"
                                            variant="label-hidden"
                                            label="Value"
                                            value={level.value}
                                            data-level={level.key}
                                            onchange={handleLevelValueChange}
                                            min="0"
                                            class="value-input"
                                        ></lightning-input>
                                        <span class="input-suffix">%</span>
                                    </div>
                                    <div class="level-color-group">
                                        <input
                                            type="color"
                                            value={level.color}
                                            data-level={level.key}
                                            onchange={handleColorChange}
                                            class="color-swatch" />
                                        <lightning-input
                                            type="text"
                                            variant="label-hidden"
                                            label="Hex"
                                            value={level.color}
                                            data-level={level.key}
                                            onchange={handleHexInput}
                                            class="hex-input"
                                            maxlength="7"
                                        ></lightning-input>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <template if:true={canAddLevel}>
                            <div class="add-level-container slds-m-top_small">
                                <lightning-button
                                    label={addLevelLabel}
                                    icon-name="utility:add"
                                    variant="neutral"
                                    onclick={handleAddLevel}
                                ></lightning-button>
                            </div>
                        </template>

                        <template if:true={hasSequentialError}>
                            <div class="validation-error slds-m-top_small">
                                <lightning-icon icon-name="utility:error" size="x-small"
                                    variant="error" class="slds-m-right_x-small"></lightning-icon>
                                <span>{sequentialError}</span>
                            </div>
                        </template>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeGroupBandsModal}></lightning-button>
                    <lightning-button
                        label="Save to all members"
                        variant="brand"
                        onclick={handleSaveGroupBands}
                        disabled={isGroupBandsSaveDisabled}
                        class="slds-m-left_small"
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <template if:true={isDashboardAssignModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container modal-dashboard-assign">
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        class="slds-modal__close"
                        onclick={closeDashboardAssignModal}
                    ></lightning-button-icon>
                    <h2 class="slds-modal__title slds-hyphenate">Assign group to school dashboard</h2>
                    <p class="slds-m-top_x-small slds-text-color_weak slds-text-body_small">
                        Drag the group and drop it on a top row or into a main menu (not on a sub-menu row). After you
                        drop, choose which assessments appear under that placement; unchecked ones stay in the group only.
                    </p>
                </header>
                <div
                    class="slds-modal__content slds-p-around_medium rollup-dnd-body"
                    ondragover={handleDndTreeDragOver}
                    style="min-height: 320px; position: relative; overflow-y: auto;"
                >
                    <template if:true={isDashboardModalLoading}>
                        <div class="slds-align_absolute-center" style="height: 200px">
                            <lightning-spinner alternative-text="Loading dashboard" size="medium"></lightning-spinner>
                        </div>
                    </template>
                    <template if:false={isDashboardModalLoading}>
                        <div class="academic-year-bar slds-m-bottom_small">
                            <lightning-combobox
                                name="academicYear"
                                label="Academic Year"
                                value={selectedAcademicYear}
                                options={academicYearOptions}
                                onchange={handleAcademicYearChange}
                                class="academic-year-combobox"
                            ></lightning-combobox>
                        </div>
                        <div class="rollup-dnd-tree-wrap" ondragover={handleDndTreeDragOver}>
                            <template if:true={isDashboardAssigning}>
                                <div class="slds-m-bottom_x-small slds-align_absolute-center">
                                    <lightning-spinner
                                        alternative-text="Saving to dashboard"
                                        size="small"
                                    ></lightning-spinner>
                                </div>
                            </template>
                            <template if:true={isDashPlaced}>
                                <div class="placed-banner slds-m-bottom_medium">
                                    <lightning-icon
                                        icon-name="utility:check"
                                        size="x-small"
                                        class="slds-m-right_small"
                                        variant="success"
                                    ></lightning-icon>
                                    <span>Group placed on the dashboard. Close when finished.</span>
                                </div>
                            </template>
                            <template if:false={isDashPlaced}>
                                <div
                                    class={dndGroupCardClass}
                                    draggable="true"
                                    ondragstart={handleDndGroupDragStart}
                                    ondragend={handleDndDragEnd}
                                >
                                    <lightning-icon
                                        icon-name="utility:drag_and_drop"
                                        size="x-small"
                                        class="slds-m-right_small drag-icon"
                                    ></lightning-icon>
                                    <span class="slds-text-body_regular slds-text-color_default">{selectedRollupGroupDisplayName}</span>
                                    <span class="slds-badge slds-badge_inverse slds-m-left_small">Drag to place</span>
                                </div>
                            </template>
                            <template if:true={hasDashTree}>
                                <div class="tree-container" ondragover={handleDndTreeDragOver}>
                                    <div
                                        class="tree-dashboard-header"
                                        oncontextmenu={handleDashHeaderCtx}
                                    >
                                        <lightning-icon
                                            icon-name="utility:dashboard"
                                            size="xx-small"
                                            class="slds-m-right_x-small"
                                        ></lightning-icon>
                                        <span class="dashboard-header-label"
                                            >Dashboard &mdash; {dashTreeDbn}</span
                                        >
                                    </div>
                                    <template for:each={dashFlatTree} for:item="item">
                                        <div key={item.key}>
                                            <template if:true={item.isDropZone}>
                                                <div
                                                    class={item.dropZoneClass}
                                                    data-key={item.key}
                                                    data-parent-id={item.parentId}
                                                    data-target-level={item.targetLevel}
                                                    data-prev-sort={item.prevSort}
                                                    data-next-sort={item.nextSort}
                                                    ondragover={handleDndDropOver}
                                                    ondragenter={handleDndDropEnter}
                                                    ondragleave={handleDndDropLeave}
                                                    ondrop={handleDndDropOnZone}
                                                >
                                                    <template if:true={item.isEmpty}>
                                                        <span class="empty-label">Drop here</span>
                                                    </template>
                                                </div>
                                            </template>
                                            <template if:true={item.isNode}>
                                                <div
                                                    class={item.nodeClass}
                                                    data-id={item.id}
                                                    data-level={item.level}
                                                    data-label={item.label}
                                                    data-is-menu={item.isMenuStr}
                                                    ondragenter={handleDndNodeEnter}
                                                    ondragleave={handleDndNodeLeave}
                                                    oncontextmenu={handleDndTreeItemCtx}
                                                >
                                                    <template if:true={item.isMenu}>
                                                        <button
                                                            class="expand-btn"
                                                            data-id={item.id}
                                                            type="button"
                                                            onclick={handleDndToggleExpand}
                                                        >
                                                            <lightning-icon
                                                                icon-name={item.expandIcon}
                                                                size="xx-small"
                                                            ></lightning-icon>
                                                        </button>
                                                    </template>
                                                    <template if:false={item.isMenu}>
                                                        <span class="page-icon-spacer">
                                                            <lightning-icon
                                                                icon-name="utility:page"
                                                                size="xx-small"
                                                            ></lightning-icon>
                                                        </span>
                                                    </template>
                                                    <span class={item.labelClass}>{item.label}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template if:false={hasDashTree}>
                                <p class="slds-text-body_regular slds-text-color_weak slds-m-top_medium slds-p-around_small">
                                    No dashboard structure was found for this school (DBN).
                                </p>
                            </template>
                        </div>
                    </template>
                    <template if:true={showDashCtx}>
                        <div class="ctx-backdrop" onclick={handleDndCtxBackdrop}></div>
                        <div class="ctx-menu">
                            <template if:false={showDashCtxInput}>
                                <button class="ctx-menu-item" type="button" onclick={handleDndCtxAdd}>
                                    <lightning-icon
                                        icon-name="utility:add"
                                        size="xx-small"
                                        class="slds-m-right_x-small"
                                    ></lightning-icon>
                                    {dndCtxLabel}
                                </button>
                            </template>
                            <template if:true={showDashCtxInput}>
                                <div class="ctx-input-wrap">
                                    <lightning-input
                                        label="Item name"
                                        variant="label-hidden"
                                        placeholder={dndCtxInputPlaceholder}
                                        value={dashNewItemName}
                                        onchange={handleDndNewName}
                                        class="ctx-input"
                                    ></lightning-input>
                                    <div class="ctx-input-actions">
                                        <lightning-button
                                            label="Save"
                                            variant="brand"
                                            size="small"
                                            onclick={handleDndNewSave}
                                            disabled={isDndNewItemSaveDisabled}
                                        ></lightning-button>
                                        <lightning-button
                                            label="Cancel"
                                            size="small"
                                            onclick={handleDndNewCancel}
                                        ></lightning-button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template if:true={dashDropConfirmOpen}>
                        <div
                            class="dash-drop-confirm-overlay"
                            role="dialog"
                            aria-modal="true"
                            aria-labelledby="dash-drop-confirm-title"
                            onclick={handleDashDropConfirmBackdrop}
                        >
                            <div class="dash-drop-confirm-panel" onclick={handleDashDropConfirmPanelClick}>
                                <h3 id="dash-drop-confirm-title" class="slds-text-heading_small slds-m-bottom_x-small">
                                    Confirm dashboard placement
                                </h3>
                                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                                    All assessments are included by default. Uncheck any you do not want under this
                                    menu or sub-menu; they stay in the rollup group.
                                </p>
                                <ul class="dash-drop-confirm-list slds-m-bottom_medium">
                                    <template for:each={dashDropConfirmRows} for:item="row">
                                        <li key={row.rowKey} class="dash-drop-confirm-li">
                                            <lightning-input
                                                type="checkbox"
                                                label={row.label}
                                                checked={row.checked}
                                                data-row-key={row.rowKey}
                                                onchange={handleDashDropConfirmToggle}
                                            ></lightning-input>
                                        </li>
                                    </template>
                                </ul>
                                <div class="dash-drop-confirm-actions">
                                    <lightning-button
                                        label="Cancel"
                                        onclick={handleDashDropConfirmCancel}
                                        disabled={isDashboardAssigning}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Confirm"
                                        variant="brand"
                                        class="slds-m-left_small"
                                        onclick={handleDashDropConfirmSave}
                                        disabled={isDashDropConfirmSaveDisabled}
                                    ></lightning-button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button
                        label="Close"
                        onclick={closeDashboardAssignModal}
                        disabled={isDashboardAssigning}
                    ></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
