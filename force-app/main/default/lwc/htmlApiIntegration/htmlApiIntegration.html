<template>
    <lightning-card icon-name="standard:dashboard_component">
        <h2 slot="title" class="slds-text-heading_small">HTML Chart Manager</h2>

        <div class="slds-p-around_medium">

            <!-- Loading spinner -->
            <template if:true={isLoading}>
                <div class="slds-align_absolute-center slds-p-vertical_x-large">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>

            <!-- STATE 1: Chart exists, prompt to fetch first -->
            <template if:true={showFetchFirst}>
                <div class="fetch-prompt slds-p-around_large slds-align_absolute-center">
                    <div class="slds-text-align_center">
                        <lightning-icon icon-name="utility:info_alt" size="large"
                                        class="slds-m-bottom_medium info-icon"></lightning-icon>
                        <p class="slds-text-heading_small slds-m-bottom_x-small">Chart Already Exists</p>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-bottom_medium">
                            Fetch the current data to view or edit it.
                        </p>
                        <lightning-button label="Fetch Data"
                                         variant="brand"
                                         icon-name="utility:download"
                                         onclick={handleFetch}></lightning-button>
                    </div>
                </div>
            </template>

            <!-- STATE 2: Fresh record — form + Submit -->
            <template if:true={showForm}>
                <lightning-textarea label="HTML Code"
                                   class="html-textarea-wrapper slds-m-bottom_medium"
                                   placeholder="Paste or type your chart HTML here…"
                                   value={htmlCode}
                                   onchange={handleHtmlChange}
                                   required></lightning-textarea>

                <fieldset class="slds-box slds-box_xx-small settings-panel slds-m-bottom_medium">
                    <legend class="slds-text-title_caps settings-legend">Settings</legend>
                    <div class="slds-grid slds-gutters slds-p-horizontal_small slds-p-bottom_small">
                        <div class="slds-col">
                            <lightning-input type="toggle"
                                            label="Show Filters"
                                            checked={showFilters}
                                            onchange={handleShowFiltersChange}
                                            message-toggle-active="Yes"
                                            message-toggle-inactive="No"></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-input type="toggle"
                                            label="Query"
                                            checked={hasQuery}
                                            onchange={handleQueryToggleChange}
                                            message-toggle-active="Yes"
                                            message-toggle-inactive="No"></lightning-input>
                        </div>
                    </div>
                    <template if:true={hasQuery}>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <lightning-textarea label="SQL Query"
                                               class="query-textarea-wrapper"
                                               placeholder='e.g. SELECT * FROM "Student__c" WHERE "DBN__c" = :dbn'
                                               value={queryStr}
                                               onchange={handleQueryChange}></lightning-textarea>
                        </div>
                    </template>
                </fieldset>

                <lightning-button label="Submit"
                                 variant="brand"
                                 icon-name="utility:upload"
                                 onclick={handleSubmit}
                                 disabled={isSubmitDisabled}></lightning-button>

                <!-- Page data panel appears below Submit when panel is ready -->
                <template if:true={showPageDataPanel}>
                    <div class="result-panel slds-m-top_medium">
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
                            <div class="result-panel__header">
                                <lightning-icon icon-name="utility:check" size="small"
                                                variant="success"
                                                class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-text-heading_small">Chart saved — Page Data</span>
                            </div>
                            <lightning-button label="Export All"
                                             icon-name="utility:export"
                                             variant="brand"
                                             onclick={handleExportAll}></lightning-button>
                        </div>

                        <div class="slds-m-bottom_small">
                            <span class="block-label">Endpoint</span>
                            <pre class="code-block slds-m-top_x-small">{pageDataCurlCmd}</pre>
                        </div>

                        <div class="slds-m-bottom_medium">
                            <span class="block-label">API Response</span>
                            <pre class="code-block slds-m-top_x-small">{pageDataResponse}</pre>
                        </div>

                        <lightning-button label="Done"
                                         variant="brand"
                                         onclick={handleDone}></lightning-button>
                    </div>
                </template>
            </template>

            <!-- STATE 3: After fetch — form + Submit + Fetch Data -->
            <template if:true={showFormAfterFetch}>
                <lightning-textarea label="HTML Code"
                                   class="html-textarea-wrapper slds-m-bottom_medium"
                                   placeholder="Paste or type your chart HTML here…"
                                   value={htmlCode}
                                   onchange={handleHtmlChange}
                                   required></lightning-textarea>

                <fieldset class="slds-box slds-box_xx-small settings-panel slds-m-bottom_medium">
                    <legend class="slds-text-title_caps settings-legend">Settings</legend>
                    <div class="slds-grid slds-gutters slds-p-horizontal_small slds-p-bottom_small">
                        <div class="slds-col">
                            <lightning-input type="toggle"
                                            label="Show Filters"
                                            checked={showFilters}
                                            onchange={handleShowFiltersChange}
                                            message-toggle-active="Yes"
                                            message-toggle-inactive="No"></lightning-input>
                        </div>
                        <div class="slds-col">
                            <lightning-input type="toggle"
                                            label="Query"
                                            checked={hasQuery}
                                            onchange={handleQueryToggleChange}
                                            message-toggle-active="Yes"
                                            message-toggle-inactive="No"></lightning-input>
                        </div>
                    </div>
                    <template if:true={hasQuery}>
                        <div class="slds-p-horizontal_small slds-p-bottom_small">
                            <lightning-textarea label="SQL Query"
                                               class="query-textarea-wrapper"
                                               placeholder='e.g. SELECT * FROM "Student__c" WHERE "DBN__c" = :dbn'
                                               value={queryStr}
                                               onchange={handleQueryChange}></lightning-textarea>
                        </div>
                    </template>
                </fieldset>

                <div class="slds-grid slds-gutters_x-small">
                    <div class="slds-col slds-shrink-none">
                        <lightning-button label="Submit"
                                         variant="brand"
                                         icon-name="utility:upload"
                                         onclick={handleSubmit}
                                         disabled={isSubmitDisabled}></lightning-button>
                    </div>
                    <div class="slds-col slds-shrink-none">
                        <lightning-button label="Fetch Data"
                                         variant="neutral"
                                         icon-name="utility:download"
                                         onclick={handleFetch}></lightning-button>
                    </div>
                </div>

                <!-- Page data panel appears below Submit/Fetch buttons when panel is ready -->
                <template if:true={showPageDataPanel}>
                    <div class="result-panel slds-m-top_medium">
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_medium">
                            <div class="result-panel__header">
                                <lightning-icon icon-name="utility:check" size="small"
                                                variant="success"
                                                class="slds-m-right_x-small"></lightning-icon>
                                <span class="slds-text-heading_small">Chart saved — Page Data</span>
                            </div>
                            <lightning-button label="Export All"
                                             icon-name="utility:export"
                                             variant="brand"
                                             onclick={handleExportAll}></lightning-button>
                        </div>

                        <div class="slds-m-bottom_small">
                            <span class="block-label">Endpoint</span>
                            <pre class="code-block slds-m-top_x-small">{pageDataCurlCmd}</pre>
                        </div>

                        <div class="slds-m-bottom_medium">
                            <span class="block-label">API Response</span>
                            <pre class="code-block slds-m-top_x-small">{pageDataResponse}</pre>
                        </div>

                        <lightning-button label="Done"
                                         variant="brand"
                                         onclick={handleDone}></lightning-button>
                    </div>
                </template>
            </template>

        </div>
    </lightning-card>
</template>
